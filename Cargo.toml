[package]
name = "sluice"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Series-aware update gating for rolling Linux distributions"
license = "MIT OR Apache-2.0"
repository = "https://github.com/max-bromberg/sluice"
readme = "README.md"
keywords = ["zypper", "kernel", "tui", "updates", "opensuse"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
ureq = { version = "2", features = ["tls", "json"], default-features = false }
ratatui = "0.29"
crossterm = "0.28"
quick-xml = { version = "0.37", features = ["serialize"] }
dirs = "5"
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

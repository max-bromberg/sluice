name: Release

# Pushing a tag like v0.2.0 builds static binaries and publishes them as a
# GitHub release, with checksums and the installer. Running this workflow by
# hand builds and tests the same binaries without publishing anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: The tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Tests
        run: cargo test --all-features --locked
      - name: Nothing personal is published
        run: scripts/privacy-check.sh --commits HEAD

  build:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            arch: aarch64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # zig as the linker gives fully static musl binaries for both
      # architectures from one runner, with no cross toolchains to maintain.
      - name: Install cargo-zigbuild
        run: pip install cargo-zigbuild
      - name: Build
        run: cargo zigbuild --release --locked --target ${{ matrix.target }}
      - name: Stage
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/sluice dist/sluice-${{ matrix.arch }}-linux
          file dist/sluice-${{ matrix.arch }}-linux
      - uses: actions/upload-artifact@v4
        with:
          name: sluice-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  # The x86_64 binary is run for real: it starts, it is static, and the
  # installer verifies it and hands over to setup.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: sluice-x86_64
          path: dist
      - name: Run it
        run: |
          chmod +x dist/sluice-x86_64-linux
          dist/sluice-x86_64-linux --version
          dist/sluice-x86_64-linux --help >/dev/null
          if ldd dist/sluice-x86_64-linux 2>/dev/null | grep -q '=>'; then
            echo "::error::the binary is dynamically linked"
            exit 1
          fi
      - name: The installer verifies and hands over
        run: scripts/test-installer.sh dist/sluice-x86_64-linux

  publish:
    needs: [build, smoke]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum sluice-* > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* install.sh \
            --title "sluice ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --verify-tag
